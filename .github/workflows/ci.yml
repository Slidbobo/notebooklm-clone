name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest

    # The access-control tests are integration tests: they assert that a tenant
    # filter holds inside a real SQL query against a real vector index. Mocking
    # the database here would test the mock, not the guarantee. This container
    # matches the image used by docker-compose.yml for local runs.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: notebooklm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway credentials for the ephemeral CI container. Not a secret.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/notebooklm_test
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@localhost:5432/notebooklm_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high
        continue-on-error: true
